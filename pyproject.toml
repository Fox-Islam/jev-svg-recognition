[project]
name = "jev-svg-recognition"
version = "0.1.0"
description = "Recognising what an SVG shows from Jev's yes/no answers about its text"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fox Islam", email = "foxislam@outlook.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "picosvg>=0.22",
    "resvg-py>=0.2",
    "pillow>=10",
]

[project.optional-dependencies]
fetch = ["pyarrow>=15", "huggingface_hub>=0.23"]
clip = ["open_clip_torch>=2.24", "torch>=2.2", "torchvision>=0.17"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevsvg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: the corpus pilot, and the Rapidata comparisons that need the fetched SVGs and the clip extra"]

[tool.ruff]
line-length = 130

[tool.ruff.format]
quote-style = "single"

# CLIP runs on the CPU here; the default torch wheels bring several GB of CUDA libraries
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
